{# A soft, tinted "plain book": spine shading, a small icon, the title, and a "No cover" label. #}
<div class="relative w-full h-full flex flex-col justify-between p-3 bg-gradient-to-br from-base-200 to-base-300 text-base-content/50" data-cover-placeholder>
  <div class="absolute inset-y-0 left-0 w-1.5 bg-base-content/10"></div>
  <div class="absolute inset-2 rounded border border-dashed border-base-content/15"></div>
  <div class="relative pl-1 flex justify-center pt-2 text-base-content/25">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-1/3 max-w-10" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" /></svg>
  </div>
  <div class="relative pl-1 text-center">
    <div class="font-serif text-[13px] leading-tight font-semibold text-base-content/60 line-clamp-2">{{ book.title }}</div>
    <div class="text-[10px] uppercase tracking-wider mt-1 text-base-content/40">No cover</div>
  </div>
</div>
