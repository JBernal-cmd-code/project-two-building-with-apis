{% extends "base.html" %}

{% block title %}Log in · MyChapterCollection{% endblock %}

{% block content %}
<div class="card bg-base-100 border border-base-300 max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Log in</h1>
    <form method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full mt-4">Log in</button>
    </form>
    <p class="text-sm mt-2">
      New here? <a href="{% url 'accounts:signup' %}" class="link link-primary">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
