[project]
name = "project-two-building-with-apis"
version = "0.1.0"
description = "Book tracker built on the Open Library API (CIDM 3312 Project 2)."
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-tailwind-cli>=4.8.2",
    "djangorestframework>=3.18.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
# Treat modules in scripts/ as our own code when sorting imports.
src = [".", "scripts"]

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus import sorting, likely bugs,
# modern syntax upgrades, and naming conventions.
extend-select = ["I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Django generates migrations with list class attributes (dependencies,
# operations); RUF012 would flag every one.
"**/migrations/*.py" = ["RUF012"]

[tool.pytest.ini_options]
# "." lets tests import the Django project; "scripts" lets tests
# `import search_books` while scripts/ stays a plain folder.
pythonpath = [".", "scripts"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
